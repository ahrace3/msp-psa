{% extends "base.html" %}
{% set active = 'documentation' %}
{% block title %}Locations · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Locations</h1>
  <a class="btn" href="/locations/new">Add location</a>
</div>
<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search name, city or company"
         hx-get="/locations" hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search locations">
</div>
<div class="panel">
  <table>
    <thead><tr><th>Name</th><th>Company</th><th>City</th><th>Phone</th></tr></thead>
    <tbody id="rows">{% include "locations/_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
