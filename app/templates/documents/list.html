{% extends "base.html" %}
{% set active = 'documents' %}
{% block title %}Documents · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Documents</h1></div>

<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search title, category or company"
         hx-get="/documents" hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search documents">
</div>

<div class="panel">
  <table>
    <thead><tr><th>Title</th><th>Company</th><th>Category</th><th>Updated</th></tr></thead>
    <tbody id="rows">{% include "documents/_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
