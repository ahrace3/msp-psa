{% extends "base.html" %}
{% set active = 'credentials' %}
{% block title %}Credentials · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Credentials</h1></div>

<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search name, username, category or company"
         hx-get="/credentials" hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search credentials">
</div>

<div class="panel">
  <table>
    <thead><tr><th>Name</th><th>Company</th><th>Category</th><th>Username</th><th>Password</th><th></th></tr></thead>
    <tbody id="rows">{% include "credentials/_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
