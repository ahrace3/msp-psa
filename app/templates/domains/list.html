{% extends "base.html" %}
{% set active = 'documentation' %}
{% block title %}Domains · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Domains</h1>
  <a class="btn" href="/domains/new">Add domain</a>
</div>
<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search domain, registrar or company"
         hx-get="/domains" hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search domains">
</div>
<div class="panel">
  <table>
    <thead><tr><th>Domain</th><th>Company</th><th>Registrar</th><th>Expires</th></tr></thead>
    <tbody id="rows">{% include "domains/_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
