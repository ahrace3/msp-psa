{% extends "base.html" %}
{% set active = 'tickets' %}
{% block title %}New ticket · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>New ticket</h1></div>

<form method="post" action="/tickets/new">
  <div class="panel">
    <div class="form-grid">
      <div class="field">
        <label for="company_id">Company</label>
        <select id="company_id" name="company_id" required
                onchange="location = '/tickets/new?company_id=' + this.value + (document.getElementById('board_id').value ? '&board_id=' + document.getElementById('board_id').value : '')">
          <option value="">Select a company</option>
          {% for c in companies %}
          <option value="{{ c.id }}" {% if preselect_company == c.id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
        <div class="sub" style="margin-top:4px">Changing this reloads to load that company's contacts and devices.</div>
      </div>
      <div class="field">
        <label for="board_id">Board</label>
        <select id="board_id" name="board_id" required>
          {% for b in boards %}
          <option value="{{ b.id }}" {% if preselect_board == b.id %}selected{% endif %}>{{ b.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="contact_id">Contact</label>
        <select id="contact_id" name="contact_id">
          <option value="">Unassigned</option>
          {% for c in contacts %}
          <option value="{{ c.id }}">{{ c.display_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="configuration_id">Configuration</label>
        <select id="configuration_id" name="configuration_id">
          <option value="">None</option>
          {% for cfg in configurations %}
          <option value="{{ cfg.id }}">{{ cfg.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          {% for p in priorities %}
          <option value="{{ p }}" {% if p == 'normal' %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>

      <fieldset><legend>Categorization (optional)</legend></fieldset>
      <div class="field">
        <label for="type_id">Type</label>
        <select id="type_id" name="type_id">
          <option value="">None</option>
          {% for t in types %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="subtype_id">Subtype</label>
        <select id="subtype_id" name="subtype_id"><option value="">Select a type first</option></select>
      </div>
      <div class="field">
        <label for="item_id">Item</label>
        <select id="item_id" name="item_id"><option value="">Select a subtype first</option></select>
      </div>

      <div class="field full">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required maxlength="255">
      </div>
      <div class="field full">
        <label for="initial_note">Description</label>
        <textarea id="initial_note" name="initial_note" placeholder="What's going on?"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Create ticket</button>
      <a class="btn secondary" href="/tickets">Cancel</a>
    </div>
  </div>
</form>
<script>
document.addEventListener("DOMContentLoaded", function () {
  initCategorySelects({{ types | tojson }}, "type_id", "subtype_id", "item_id", null, null, null);
});
</script>
{% endblock %}
