{% extends "base.html" %}
{% set active = 'tickets' %}
{% block title %}Tickets · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Tickets</h1>
  <a class="btn" href="/tickets/new">New ticket</a>
</div>

<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search subject, number, company or note text"
         hx-get="/tickets{% if board_id %}?board_id={{ board_id }}{% endif %}"
         hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search tickets">
</div>

<div class="panel">
  <table>
    <thead>
      <tr><th>#</th><th>Subject</th><th>Company</th><th>Board</th><th>Status</th><th>Priority</th><th>Assigned</th><th>Updated</th></tr>
    </thead>
    <tbody id="rows">{% include "tickets/_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
