{% for cred, company in rows %}
<tr>
  <td>{{ cred.name }}</td>
  <td><a href="/companies/{{ company.id }}">{{ company.name }}</a></td>
  <td>{{ cred.category or "—" }}</td>
  <td class="mono">{{ cred.username or "—" }}</td>
  <td id="cred-secret-{{ cred.id }}">
    <span class="mono">••••••••</span>
    <a href="#" hx-get="/credentials/{{ cred.id }}/reveal" hx-target="#cred-secret-{{ cred.id }}" hx-swap="innerHTML">Show</a>
  </td>
  <td><a href="/credentials/{{ cred.id }}/edit">Edit</a></td>
</tr>
{% else %}
<tr><td colspan="6" class="empty">No credentials match that search.</td></tr>
{% endfor %}
