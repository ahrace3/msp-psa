{% extends "base.html" %}
{% set active = 'companies' %}
{% block title %}Companies · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Companies</h1>
  <a class="btn" href="/companies/new">Add company</a>
</div>

<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search name, ID or city"
         hx-get="/companies" hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search companies">
</div>

<div class="panel">
  <table>
    <thead>
      <tr><th>Company</th><th>ID</th><th>Status</th><th>City</th><th>Phone</th><th>Ninja org</th></tr>
    </thead>
    <tbody id="rows">
      {% include "companies/_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
