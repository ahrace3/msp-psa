{% extends "base.html" %}
{% set active = 'boards' %}
{% block title %}Boards · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Boards</h1></div>
<div class="panel">
  <table>
    <thead><tr><th>Board</th><th class="num">Open tickets</th></tr></thead>
    <tbody>
      {% for b, count in boards %}
      <tr>
        <td><a href="/boards/{{ b.slug }}">{{ b.name }}</a></td>
        <td class="num">{{ count }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
