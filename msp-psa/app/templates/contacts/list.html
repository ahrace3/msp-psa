{% extends "base.html" %}
{% set active = 'contacts' %}
{% block title %}Contacts · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Contacts</h1>
  <a class="btn" href="/contacts/new">Add contact</a>
</div>

<div class="search">
  <input type="text" name="q" value="{{ q }}" placeholder="Search name, email or company"
         hx-get="/contacts" hx-trigger="keyup changed delay:250ms"
         hx-target="#rows" hx-swap="innerHTML" aria-label="Search contacts">
</div>

<div class="panel">
  <table>
    <thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Licensed</th><th>Billable</th><th>Source</th><th></th></tr></thead>
    <tbody id="rows">{% include "contacts/_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
